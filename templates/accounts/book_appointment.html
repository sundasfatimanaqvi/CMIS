{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Healio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center">Book Appointment</h2>
        <h4 class="text-center">Dr. {{ doctor.user.username }} - {{ doctor.specialization }}</h4>

        <form method="POST">
            {% csrf_token %}
            
            <label><strong>Select a Date</strong></label>
            <select name="date" id="date-select" class="form-control" required>
                <option value="">-- Choose Date --</option>
                {% for date in available_dates %}
                    <option value="{{ date }}">{{ date }}</option>
                {% endfor %}
            </select>

            <label class="mt-3"><strong>Select a Time</strong></label>
            <select name="time" id="time-select" class="form-control" required>
                <option value="">-- Choose Time --</option>
            </select>

            <label class="mt-3"><strong>Name:</strong></label>
            <input type="text" name="name" value="{{ request.user.username }}" class="form-control" required readonly>

            <label class="mt-3"><strong>Patient ID:</strong></label>
            <input type="text" name="patient_id" value="{{ request.user.patient.patient_id }}" class="form-control" required readonly>

            <label class="mt-3"><strong>Reason for Appointment:</strong></label>
            <textarea name="description" class="form-control" required></textarea>

            <button type="submit" class="btn btn-primary mt-3 w-100">Confirm Appointment</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const timeSelect = document.getElementById("time-select");

        // Default available time slots
        const availableTimeSlots = {
            "start": "{{ available_time_slots.start }}",
            "end": "{{ available_time_slots.end }}"
        };

        // Generate time slots dynamically
        document.getElementById("date-select").addEventListener("change", function() {
            timeSelect.innerHTML = "<option value=''>-- Choose Time --</option>";

            let startTime = availableTimeSlots.start;
            let endTime = availableTimeSlots.end;
            let currentTime = startTime;

            while (currentTime < endTime) {
                let option = document.createElement("option");
                option.value = currentTime;
                option.textContent = currentTime;
                timeSelect.appendChild(option);

                let [hours, minutes] = currentTime.split(":").map(Number);
                minutes += 30;
                if (minutes >= 60) {
                    hours += 1;
                    minutes = 0;
                }
                currentTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
        });
    });
</script>

</body>
</html>
