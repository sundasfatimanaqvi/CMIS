<nav class="navbar navbar-expand-lg hl-nav" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Healio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hlNavMenu"
                aria-controls="hlNavMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="hlNavMenu">
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item">
                    <a class="btn btn-outline-light ms-lg-2 mt-2 mt-lg-0" href="{% url 'about' %}">About Us</a>
                </li>
                {% if user.is_authenticated %}
                    {% if user.patient %}
                    <li class="nav-item">
                        <a class="btn btn-outline-light ms-lg-2 mt-2 mt-lg-0" href="{% url 'search_doctor' %}">Find a Doctor</a>
                    </li>

                        <a class="btn btn-outline-light ms-lg-2 mt-2 mt-lg-0" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'logout' %}" class="d-inline">

                            <button type="submit" class="btn btn-outline-danger ms-lg-2 mt-2 mt-lg-0">Logout</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="btn btn-outline-primary ms-lg-2 mt-2 mt-lg-0" href="{% url 'login' %}">Login / Signup</a>
