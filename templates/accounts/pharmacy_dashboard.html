<!-- templates/accounts/pharmacy_dashboard.html -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Pharmacy Portal</h2>
    <form method="GET" action="{% url 'pharmacy_lookup' %}">
        <div class="input-group mb-3">
            <input type="text" name="patient_id" class="form-control" placeholder="Enter Patient ID" required>
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>
</div>
{% endblock %}
