{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - Healio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 0;
            /* display: flex; */
            justify-content: center;  /* Centers horizontally */
            align-items: center;      /* Centers vertically */
            min-height: 100vh;        /* Ensures full height of viewport */
            margin: 0;                /* Remove default margin */
        }

        /* Container Styling */
        .container-doctor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Profile Image */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ddd;
            display: block;
            margin: auto;
            object-fit: cover;
        }

        /* Input Fields */
        .form-control {
            margin-bottom: 15px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    {% include "navbar.html" %}


    <div class="container-doctor">
        <h2>Doctor Profile</h2>
        
        <!-- Profile Image -->
        <!-- <img src="{{ doctor.profile_picture.url }}" class="avatar" alt="Doctor Avatar" onerror="this.src='{% static 'icons/default-avatar.png' %}'"> -->
            <img src="{{ doctor.profile_picture.url }}" class="avatar" alt="Doctor Avatar" 
        onerror="this.src='{% static 'icons/default-avatar.png' %}'">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <label>Upload Profile Picture:</label>
            <input type="file" name="profile_picture" class="form-control">

            <label>Username:</label>
            <input type="text" name="username" class="form-control" value="{{ doctor.user.username }}" required>

            <label>New Password (Leave blank to keep current):</label>
            <input type="password" name="password" class="form-control">

            <!-- Set Availability -->
            <h4>Set Availability:</h4>
            <label>Start Time:</label>
            <input type="time" name="start_time" class="form-control" value="{{ doctor.availability.start }}">

            <label>End Time:</label>
            <input type="time" name="end_time" class="form-control" value="{{ doctor.availability.end }}">

            <!-- Unavailable Days Selection -->
            <h4>Select Unavailable Days:</h4>
            <input type="text" id="unavailable_days" name="unavailable_days" class="form-control">

            <button type="submit" class="submit-btn">Update Profile</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            flatpickr("#unavailable_days", {
                mode: "multiple",
                dateFormat: "Y-m-d",
                disableMobile: true
            });
        });
    </script>
 
 
</body>
</html>
