{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Portal - Healio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .search-box {
            text-align: center;
        }
        .prescription-section {
            display: none;
        }
        .status-fulfilled {
            color: green;
            font-weight: bold;
        }
        .status-not-fulfilled {
            color: red;
            font-weight: bold;
        }
        .footer {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Healio - Pharmacy Portal</h1>
    </div>

    <!-- Search Section -->
    <div class="container mt-4">
        <div class="search-box">
            <h3>Search Patient Prescriptions</h3>
            <input type="text" id="patient_id" class="form-control" placeholder="Enter Patient ID">
            <button class="btn btn-primary mt-2" onclick="searchPrescriptions()">Search</button>
        </div>

        <!-- Prescription Table -->
        <div class="prescription-section mt-4">
            <h3>Prescribed Medicines</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Medication</th>
                        <th>Dosage</th>
                        <th>Instructions</th>
                        <th>Doctor</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="prescriptionTableBody">
                    <tr><td colspan="6" class="text-center">No prescriptions found</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        <p>Contact Us: +92 12345 | © 2025 Healio. All Rights Reserved.</p>
    </div>

    <script>
        function searchPrescriptions() {
            let patientId = document.getElementById('patient_id').value;

            if (!patientId) {
                alert("Please enter a Patient ID");
                return;
            }

            fetch(`/get_prescriptions/${patientId}/`)
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.getElementById('prescriptionTableBody');
                    tableBody.innerHTML = '';

                    if (data.prescriptions.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="6" class="text-center">No prescriptions found</td></tr>`;
                        return;
                    }

                    data.prescriptions.forEach(prescription => {
                        let statusClass = prescription.status === "Fulfilled" ? "status-fulfilled" : "status-not-fulfilled";
                        tableBody.innerHTML += `
                            <tr>
                                <td>${prescription.medication_name}</td>
                                <td>${prescription.dosage}</td>
                                <td>${prescription.instructions}</td>
                                <td>${prescription.doctor}</td>
                                <td class="${statusClass}" id="status-${prescription.id}">${prescription.status}</td>
                                <td>
                                    <button class="btn btn-sm btn-success" onclick="updateStatus(${prescription.id}, 'Fulfilled')">Fulfilled</button>
                                    <button class="btn btn-sm btn-danger" onclick="updateStatus(${prescription.id}, 'Not Fulfilled')">Not Fulfilled</button>
                                </td>
                            </tr>
                        `;
                    });

                    document.querySelector('.prescription-section').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error fetching prescriptions:', error);
                    alert("Error fetching prescriptions. Please try again.");
                });
        }

        function updateStatus(prescriptionId, status) {
            fetch(`/update_prescription_status/${prescriptionId}/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRFToken()
                },
                body: JSON.stringify({ status: status })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    let statusElement = document.getElementById(`status-${prescriptionId}`);
                    statusElement.textContent = status;
                    statusElement.className = status === "Fulfilled" ? "status-fulfilled" : "status-not-fulfilled";
                } else {
                    alert("Failed to update status. Please try again.");
                }
            })
            .catch(error => {
                console.error('Error updating status:', error);
                alert("Error updating prescription status.");
            });
        }

        function getCSRFToken() {
            let csrfToken = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
            return csrfToken ? csrfToken.split('=')[1] : '';
        }
    </script>

</body>
</html>
