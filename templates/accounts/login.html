{% extends 'accounts/base.html' %}
{% load static %}
{% block title %}Login{% endblock %}

{% block fullwidth %}
<div class="hl-auth">
    <div class="hl-auth-side" style="background-image: url('{% static 'icons/advice.png' %}');" aria-hidden="true"></div>
    <div class="hl-auth-form">
        <div class="hl-auth-box">
            <h1>Welcome back</h1>
            <p class="text-muted mb-4">Log in to your Healio account.</p>

            <form method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {% if form.non_field_errors %}
                    <div class="alert alert-danger" role="alert">{{ form.non_field_errors.0 }}</div>
                {% endif %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
            </form>
            <p class="mt-4 mb-0 text-center">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
